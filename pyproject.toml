[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slurminator"
version = "0.1.0"
authors = [{ name = "Tord Sture Stangeland" }]
maintainers = [{ name = "Tord Sture Stangeland" }]
description = "Reusable SLURM/HPC experiment orchestration package."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3",
  "pydantic>=2",
  "PyYAML>=6",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "black==24.4.2",
  "build>=1",
  "pytest>=8",
  "ruff>=0.12,<0.13",
]

[project.scripts]
slurminator = "slurminator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
skip-string-normalization = true
skip-magic-trailing-comma = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
markers = [
  "unit: fast unit tests",
]
